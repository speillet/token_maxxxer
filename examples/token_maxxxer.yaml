# All relative paths are resolved from this file.
timezone: Europe/Paris
provider:
  name: claude
  model: claude-sonnet-5-5
  max_output_tokens: 4096
  timeout_seconds: 60
schedule:
  windows:
    - days: [mon, tue, wed, thu, fri, sat, sun]
      start: '22:00'
      end: '07:00'
  stop_policy: strict
  shutdown_grace_seconds: 10
repositories:
  allowed: [..]  # Replace with explicitly allowed Git roots.
execution:
  concurrency: 1
  task_timeout_minutes: 30
  verification_timeout_seconds: 300
  max_attempts_per_task: 3
  max_active_minutes_per_window: 240
  retry_backoff_seconds: [300, 900, 1800]
authentication:
  mode: api_key
  env_file: ../.env
git:
  worktree_per_task: true
  auto_merge: false
storage:
  database: ../var/token_maxxxer.sqlite
  checkpoints: ../var/checkpoints.sqlite
  reports: ../var/reports
