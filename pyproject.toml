[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "token_maxxxer"
version = "0.0.1"
description = "Local development-task orchestration with configurable AI API providers"
readme = "readme.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "anthropic>=0.75,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "tzdata>=2025.2",
]

[project.scripts]
token_maxxxer = "token_maxxxer.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/token_maxxxer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/token_maxxxer"]
